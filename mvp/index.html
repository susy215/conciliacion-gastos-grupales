<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Conciliacion de gastos grupales</title>
        <link rel="stylesheet" href="styles.css">
    </head>
        <body>

            <h1> Conciliacion de gastos grupales</h1>
            
            <h2>Actividades</h2>
            <p>Selecciona una actividad existente o crea una nueva</p>

            <button id="crearActividad">Crear actividad</button>
            <br>
            <button id="actividad">Paseo a Samaipata</button>
    
    <div id="formularioActividad" style="display: none;">
        <h2>Crear actividad</h2>

        <label for="nombreActividad">Nombre de la actividad:</label>
        <input type="text" id="nombreActividad" list="actividadesSugeridas">

        <datalist id="actividadesSugeridas">
            <option value="Choripaneada">
            <option value="Churrasco">
            <option value="Cine">
            <option value="Teatro">
            <option value="Paseo o viaje">
        </datalist>

        <br>
        <button id="confirmarActividad">Confirmar creación</button>
    </div>
     
    <div id="resultadoActividad" style="display: none;">
        <h3>Actividad creada</h3>
        <p id="mensajeActividad"></p>
        <p id="actividadNueva"></p>

        <!-- <button id="actividadNueva"></button> -->
         
    </div>

    <div id="registro" style="display: none;">
        <h2>Registrar gasto</h2>
        <label>Monto:</label>
        <input type="number" id="monto">
        <br>
        <label>Pagador:</label>
        
        <select id="pagador">
            <option>Ana</option>
            <option>Beto</option>
            <option>Carla</option>
            <option>Diego</option>
         
        </select>

        <h3>Seleccionar integrantes</h3>
        <input type="checkbox" id="ana">
        <label for="ana">Ana</label>

        <br>
        <input type="checkbox" id="beto">
        <label for="beto">Beto</label>

        <br>
        <input type="checkbox" id="carla">
        <label for="carla">Carla</label>

        <br>
        <input type="checkbox" id="diego">
        <label for="diego">Diego</label>  

         <br>
        <button id="registrar">Registrar gasto</button>

        <div id="confirmacion" style="display: none;">
            <h3>Confirmar gasto</h3>
            <p id="resumen"></p>
            <button id="confirmar">Confirmar</button>
        </div>

        <div id="resultado" style="display: none;">
            <h3>Resultado</h3>
            <p id="saldos"></p>
        </div>

    </div>
            <script src="script.js"></script>
        </body>

</html>
